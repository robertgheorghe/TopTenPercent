services:
  app:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is missing or empty in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing or empty in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:8000"
    command: ["sh", "-c", "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"]
  db:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_DB: toptenpercent
      POSTGRES_USER: toptenpercent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing or empty in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "toptenpercent", "-d", "toptenpercent"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data: